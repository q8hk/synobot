services:
  synobot:
    image: ${REGISTRY:-registry.abdullahserver.local}/${IMAGE_NAME:-synobot}:${TAG:-latest}
    build:
      context: .
      args:
        VERSION: ${SYNOBOT_VERSION:-dev}
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_ADMIN_USER_IDS: ${TELEGRAM_ADMIN_USER_IDS:?set TELEGRAM_ADMIN_USER_IDS}
      TELEGRAM_NOTIFY_USER_IDS: ${TELEGRAM_NOTIFY_USER_IDS:?set TELEGRAM_NOTIFY_USER_IDS}
      DSM_BASE_URL: ${DSM_BASE_URL:?set DSM_BASE_URL}
      DSM_USERNAME: ${DSM_USERNAME:?set DSM_USERNAME}
      DSM_PASSWORD_FILE: /run/secrets/dsm_password
      DSM_TLS_VERIFY: ${DSM_TLS_VERIFY:-true}
      DSM_REQUEST_TIMEOUT_SECONDS: ${DSM_REQUEST_TIMEOUT_SECONDS:-20}
      DSM_POLL_INTERVAL_SECONDS: ${DSM_POLL_INTERVAL_SECONDS:-10}
      DATABASE_PATH: /data/synobot.db
      TELEGRAM_LANGUAGE: ${TELEGRAM_LANGUAGE:-en}
      TZ: ${TZ:-UTC}
    secrets:
      - telegram_bot_token
      - dsm_password
    volumes:
      - synobot-data:/data
    tmpfs:
      - /tmp/uploads:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700,size=64m
    stop_grace_period: 30s
    pull_policy: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  telegram_bot_token:
    file: ${TELEGRAM_BOT_TOKEN_FILE:-./secrets/telegram_bot_token}
  dsm_password:
    file: ${DSM_PASSWORD_FILE:-./secrets/dsm_password}

volumes:
  synobot-data:
