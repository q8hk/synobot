name: Tests

on:
  push:
    branches:
      - master
      - phase1-stabilization
      - phase2-characterization
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test tooling
        run: python -m pip install --requirement requirements-dev.txt

      - name: Install modern package
        run: python -m pip install --editable .

      - name: Run characterization tests
        run: PYTHONPATH=src:. python -m coverage run -m pytest -q

      - name: Report coverage
        run: python -m coverage report

      - name: Compile production sources
        run: python -m compileall -q . src
