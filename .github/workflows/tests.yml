name: Tests
on:
  push:
    branches: [master, "phase*"]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tooling
        run: python -m pip install --requirement requirements-dev.txt
      - name: Install modern package
        run: python -m pip install --editable .
      - name: Run test suite with coverage
        run: PYTHONPATH=src:. python -m coverage run -m pytest -q
      - name: Enforce coverage threshold
        run: python -m coverage report --fail-under=70
      - name: Compile production sources
        run: python -m compileall -q . src
